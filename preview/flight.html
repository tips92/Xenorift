<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Xeno Rift — aperçu vol 3D</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05010f;
        overflow: hidden;
        font-family: 'Exo 2', system-ui, sans-serif;
      }
      #root {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      #hud {
        position: fixed;
        left: 10px;
        top: 8px;
        z-index: 10;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(5, 1, 15, 0.55);
        color: #dff8ff;
        font: 13px/1.45 ui-monospace, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }
      #toast {
        position: fixed;
        left: 50%;
        top: 18%;
        z-index: 11;
        transform: translateX(-50%);
        color: #fff;
        font: 700 34px/1 system-ui, sans-serif;
        text-shadow: 0 0 12px rgba(63, 240, 255, 0.9);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.15s;
      }
      #toast.bad {
        text-shadow: 0 0 12px rgba(255, 51, 85, 0.95);
      }
      #toast.good {
        text-shadow: 0 0 12px rgba(61, 255, 160, 0.95);
      }
      #end {
        position: fixed;
        inset: 0;
        z-index: 12;
        display: none;
        align-items: center;
        justify-content: center;
        color: #fff;
        font: 600 18px/1.6 system-ui, sans-serif;
        text-align: center;
        background: rgba(5, 1, 15, 0.6);
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <!-- Aperçu : ?stage=f1|f2 &autopilot=1 &ts=1..8 (accélération) — flèches : piloter, espace : turbo,
         P : pause, R : rejouer, W : gagner, F : échouer -->
    <div id="root"></div>
    <div id="hud"></div>
    <div id="toast"></div>
    <div id="end"></div>
    <script type="module" src="./flight.ts"></script>
  </body>
</html>
