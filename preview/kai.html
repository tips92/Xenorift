<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xeno Rift — Kaï (.glb)</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #05010f;
        color: #e8f6ff;
        font-family: 'Exo 2', sans-serif;
      }
      main {
        display: flex;
        flex-wrap: wrap;
        gap: 28px;
        align-items: flex-end;
        padding: 24px;
      }
      figure {
        margin: 0;
      }
      figcaption {
        margin-bottom: 8px;
        font-size: 14px;
        color: #c8fdff;
      }
      canvas {
        display: block;
        background:
          linear-gradient(#1a1030, #1a1030) 0 100% / 100% 2px no-repeat,
          #0b0618;
        box-shadow: 0 0 0 1px rgba(200, 253, 255, 0.35);
      }
      canvas.game {
        width: 384px;
        height: 480px;
        image-rendering: auto;
      }
      p {
        margin: 0 24px 24px;
        max-width: 52em;
        line-height: 1.45;
        font-size: 15px;
      }
      label {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        margin: 0 24px 12px;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main id="frames"></main>
    <label><input id="hide-arm" type="checkbox" checked /> Masquer le bras proche (l'arme reste le sprite du jeu)</label>
    <p id="status">Chargement du modèle…</p>
    <script type="module" src="./kai.ts"></script>
  </body>
</html>
