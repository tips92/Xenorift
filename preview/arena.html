<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Xeno Rift — arène 3D (essai)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05010f;
        color: #e8f6ff;
        font-family: 'Exo 2', sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #view {
        position: fixed;
        inset: 0;
      }
      #view canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #hud {
        position: fixed;
        top: 10px;
        left: 14px;
        right: 14px;
        display: flex;
        gap: 18px;
        align-items: center;
        pointer-events: none;
        font-size: 18px;
        text-shadow: 0 0 6px #000;
      }
      #back {
        pointer-events: auto;
        font: 600 18px 'Exo 2', sans-serif;
        color: #c8fdff;
        background: rgba(20, 10, 40, 0.6);
        border: 1px solid rgba(200, 253, 255, 0.45);
        border-radius: 8px;
        width: 40px;
        height: 36px;
      }
      #hearts {
        color: #ff5a8c;
        letter-spacing: 3px;
        font-size: 22px;
      }
      #wave {
        color: #3ff0ff;
      }
      #score {
        margin-left: auto;
        color: #ffd36b;
      }
      #stats {
        position: fixed;
        bottom: 6px;
        left: 50%;
        transform: translateX(-50%);
        font: 12px monospace;
        color: #9fb4d8;
        pointer-events: none;
        opacity: 0.8;
      }
      #banner {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 34px;
        color: #c8fdff;
        text-shadow: 0 0 14px #3ff0ff;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s;
      }
      #banner.on {
        opacity: 1;
      }
      #banner small {
        display: block;
        font-size: 18px;
        color: #e8f6ff;
        margin-top: 8px;
      }
      .stick {
        position: fixed;
        width: 120px;
        height: 120px;
        margin: -60px 0 0 -60px;
        border-radius: 50%;
        border: 2px solid rgba(200, 253, 255, 0.45);
        background: rgba(20, 10, 40, 0.25);
        pointer-events: none;
        display: none;
      }
      .stick.on {
        display: block;
      }
      .stick i {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 50px;
        height: 50px;
        margin: -25px 0 0 -25px;
        border-radius: 50%;
        background: rgba(63, 240, 255, 0.55);
      }
      #stick-aim i {
        background: rgba(255, 154, 46, 0.6);
      }
      .hint {
        position: fixed;
        bottom: 26px;
        font-size: 14px;
        color: rgba(232, 246, 255, 0.55);
        pointer-events: none;
      }
      #hint-l {
        left: 18px;
      }
      #hint-r {
        right: 18px;
      }
    </style>
  </head>
  <body>
    <div id="view"></div>
    <div id="hud"><button id="back" type="button" aria-label="Retour">◀</button><span id="hearts"></span><span id="wave"></span><span id="score"></span></div>
    <div id="banner"></div>
    <div id="stats"></div>
    <div class="stick" id="stick-move"><i></i></div>
    <div class="stick" id="stick-aim"><i></i></div>
    <span class="hint" id="hint-l">◀ bouger</span>
    <span class="hint" id="hint-r">viser et tirer ▶</span>
    <script type="module" src="./arena.ts"></script>
  </body>
</html>
